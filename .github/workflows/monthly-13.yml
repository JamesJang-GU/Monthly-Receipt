name: Monthly 13th → KT Bill → Notion

on:
  schedule:
    - cron: "0 0 13 * *"        # KST 13일 09:00 자동 실행
  workflow_dispatch:            # 수동 테스트용 (현재 날짜 기준으로 실행)

permissions:
  contents: read

concurrency:
  group: monthly-kt-bill
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      BILL_CONFIG: ${{ secrets.BILL_CONFIG }}
    steps:
      - uses: actions/checkout@v4

      - name: 한글 폰트 다운로드 (필수)
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/NanumGothic.ttf \
            https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Regular.ttf
          curl -fsSL -o assets/fonts/NanumGothic-Bold.ttf \
            https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Bold.ttf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python main.py

      - uses: actions/upload-artifact@v4
        with:
          name: kt-bill-${{ github.run_number }}
          path: out/*.png
          retention-days: 90
